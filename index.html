<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark vs Blaze - Energy Duel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <!-- HUD -->
    <div id="hud">
      <div class="player-hud" id="hud-p1">
        <div class="name">SPARK <span class="weapon" id="wp1">FISTS</span></div>
        <div class="bar health"><div class="fill" id="hp1"></div></div>
        <div class="bar meter"><div class="fill" id="mt1"></div></div>
      </div>

      <div id="timer">&#8734;</div>

      <div class="player-hud right" id="hud-p2">
        <div class="name"><span class="weapon" id="wp2">FISTS</span> BLAZE</div>
        <div class="bar health"><div class="fill" id="hp2"></div></div>
        <div class="bar meter"><div class="fill" id="mt2"></div></div>
      </div>
    </div>

    <canvas id="game" width="960" height="540"></canvas>

    <!-- Center banner for round start / KO / winner -->
    <div id="banner" class="hidden"><span id="banner-text"></span></div>

    <footer id="controls">
      <span><b>P1 (Spark):</b> A/D move (2&times;=dash) &middot; W jump &middot; S block &middot; F light &middot; G heavy &middot; S+G launcher &middot; H beam/super &middot; <b>Q weapon</b> &middot; <b>E ability</b></span>
      <span><b>P2 (Blaze):</b> &larr;/&rarr; move (2&times;=dash) &middot; &uarr; jump &middot; &darr; block &middot; J light &middot; K heavy &middot; &darr;+K launcher &middot; L beam/super &middot; <b>U weapon</b> &middot; <b>O ability</b></span>
    </footer>
  </div>

  <!-- Classic scripts, loaded in dependency order (no modules => works over file:// too) -->
  <script src="js/input.js"></script>
  <script src="js/skeleton.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/weapons.js"></script>
  <script src="js/projectile.js"></script>
  <script src="js/fighter.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
